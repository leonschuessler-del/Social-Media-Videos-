# Lokale Entwicklungsumgebung: Postgres + MinIO (S3-kompatibel) + API + Worker + Web
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contentos
      POSTGRES_PASSWORD: contentos
      POSTGRES_DB: contentos
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentos"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  api:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    command: ["node", "--import", "tsx", "apps/server/src/api.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://contentos:contentos@postgres:5432/contentos
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
    volumes: ["./data:/app/data"]

  worker:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    command: ["node", "--import", "tsx", "apps/server/src/worker.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://contentos:contentos@postgres:5432/contentos
    depends_on:
      postgres: { condition: service_healthy }
    volumes: ["./data:/app/data"]

volumes:
  pgdata:
  miniodata:
